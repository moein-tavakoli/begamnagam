<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" href="data:,">
  <title>ورود به مستندات خصوصی بگم نگم</title>
  <style>
    @font-face{font-family:VazirmatnFD;src:url('/static/admin/fonts/vazirmatn-fd/Vazirmatn-FD-Regular.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#f4f7fb;color:#172332;font-family:VazirmatnFD,sans-serif;line-height:1.8}
    main{max-width:460px;margin:8vh auto;padding:28px;background:white;border:1px solid #d1dbe8;border-radius:12px}h1{font-size:23px;margin:0 0 12px}p{margin:0 0 20px}
    label{display:block;margin:16px 0 6px}input,button{width:100%;min-height:48px;border-radius:6px;font:inherit;font-size:16px}input{padding:8px 12px;border:1px solid #52647b;direction:ltr;text-align:left}
    button{margin-top:24px;border:0;background:#174c8c;color:white;cursor:pointer}input:focus-visible,button:focus-visible{outline:3px solid #175cd3;outline-offset:3px}.error{padding:12px;background:#fff0ef;color:#8e2424;border:1px solid #d9a4a0;border-radius:6px}
    @media(max-width:480px){main{margin:24px auto;padding:20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main>
    <h1>ورود به مستندات خصوصی</h1>
    <p>با حساب مجاز مشاهدهٔ مستندات بگم نگم وارد شوید. این دسترسی برای راهنمای API فرانت و ربات‌هاست.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/api/v2/document/login">
      {% csrf_token %}
      <label for="username">نام کاربری</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="150" required autofocus>
      <label for="password">رمز ورود</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit">ورود به Swagger</button>
    </form>
  </main>
</body>
</html>
