# Opt-in CT capacity profile. Apply after internal + hardened, using the SAME
# reviewed frontend image for all six replicas. Requires healthy writable
# storage and a successful backup before activation; never a repair for EROFS.
services:
  proxy:
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 384MiB
      FRONTEND_REPLICAS: "6"
    depends_on:
      frontend2: {condition: service_healthy}
      frontend3: {condition: service_healthy}
      frontend4: {condition: service_healthy}
      frontend5: {condition: service_healthy}
      frontend6: {condition: service_healthy}
  frontend:
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    stop_grace_period: 60s
  frontend2:
    extends: {file: compose.internal.yaml, service: frontend}
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3001"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    stop_grace_period: 60s
  frontend3:
    extends: {file: compose.internal.yaml, service: frontend}
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3002"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    stop_grace_period: 60s
  backend:
    # Six request threads total; leaves headroom within the existing PostgreSQL
    # max_connections=20 for Celery, beat, administration and health checks.
    command: [gunicorn, config.wsgi:application, --bind, "127.0.0.1:8000", --workers, "3", --threads, "2", --preload, --timeout, "45", --access-logfile, "-", --access-logformat, "%(m)s %(U)s %(s)s %(L)s"]
    mem_limit: 768m
    stop_grace_period: 60s
  frontend4:
    extends: {file: compose.internal.yaml, service: frontend}
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3003"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    stop_grace_period: 60s
  frontend5:
    extends: {file: compose.internal.yaml, service: frontend}
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3004"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3004').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    stop_grace_period: 60s
  frontend6:
    extends: {file: compose.internal.yaml, service: frontend}
    mem_limit: 768m
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "3005"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3005').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    stop_grace_period: 60s
  worker:
    mem_limit: 256m
  beat:
    mem_limit: 192m
