# Optional LAN display listener. Load alongside nginx.begamnagam-upstream.conf.
# Bind to the edge's private LAN address and keep this port behind the LAN firewall.
server {
    listen 192.168.1.6:8082;
    server_name 192.168.1.6;

    allow 192.168.1.0/24;
    deny all;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    proxy_http_version 1.1;
    proxy_set_header Host begamnagam.ir;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Begam-Monitoring-TV "1";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Strict-Transport-Security;

    location = /manage/monitoring/tv {
        # Next sends the restrictive frame-ancestors list for this exact document.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Set-Cookie;
        proxy_pass http://begamnagam_app;
    }

    location = /api/v1/manage/monitoring {
        proxy_pass http://begamnagam_app;
    }

    location ^~ /_next/static/ {
        proxy_pass http://begamnagam_app;
    }

    location ^~ /fonts/vazirmatn-fd/ {
        proxy_pass http://begamnagam_app;
    }

    location / {
        return 404;
    }
}
