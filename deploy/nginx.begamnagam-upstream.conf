# Nginx 1.22+: load in http context (e.g. conf.d/begamnagam-upstream.conf).
# Keep recipient paths out of logs in the accompanying domain site config.
map $http_upgrade $begamnagam_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream begamnagam_app {
    server 192.168.1.123:80;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
