# Domain-specific site; install with nginx.begamnagam-upstream.conf.
# HTTP → HTTPS
server {
    listen 80;
    server_name begamnagam.ir;

    # Let's Encrypt HTTP-01 Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location ^~ /r/ {
        # Recipient capability paths must never enter request/error logs.
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 301 https://begamnagam.ir$request_uri;
    }

    location / {
        return 301 https://begamnagam.ir$request_uri;
    }
}

# HTTPS Reverse Proxy
server {
    listen 443 ssl;
    server_name begamnagam.ir;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/begamnagam.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/begamnagam.ir/privkey.pem;

    # TLS Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reverse Proxy
    location = /r {
        # Preserve existing fragment links without Nginx slash redirects.
        access_log off;
        error_log /dev/null;
        proxy_pass http://begamnagam_app;

        proxy_http_version 1.1;

        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $begamnagam_connection_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Upload Size
        client_max_body_size 100M;
    }

    location ^~ /r/ {
        # Recipient capability paths must never enter request/error logs.
        access_log off;
        error_log /dev/null;
        proxy_pass http://begamnagam_app;

        proxy_http_version 1.1;

        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $begamnagam_connection_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Upload Size
        client_max_body_size 100M;
    }

    location / {
        proxy_pass http://begamnagam_app;

        proxy_http_version 1.1;

        # Forward original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $begamnagam_connection_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Upload Size
        client_max_body_size 100M;
    }
}
