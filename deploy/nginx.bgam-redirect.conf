# Install on the central Nginx alongside the main domain site.
server {
    listen 80;
    listen 443 ssl;
    server_name bgam.ir;

    ssl_certificate /etc/letsencrypt/live/bgam.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bgam.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Recipient links carry private capability codes in the request path.
    access_log off;
    error_log /dev/null;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /r/ {
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        return 301 https://begamnagam.ir$request_uri;
    }

    location / {
        return 301 https://begamnagam.ir$request_uri;
    }
}
