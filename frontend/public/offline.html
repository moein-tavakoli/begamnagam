<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="برای ورود، ارسال پیام و مدیریت دریافت در بگم نگم به اینترنت نیاز داری. پس از اتصال، وضعیت درخواست قبلی را بررسی کن."><meta name="referrer" content="no-referrer"><link rel="icon" href="/icon.svg" type="image/svg+xml"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="theme-color" content="#f2eeff"><title>اتصال قطع شده | بگم نگم</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f2eeff;color:#201c29;font:17px/2 Tahoma,Arial,sans-serif}main{max-width:440px;padding:36px 26px;background:white;border-radius:32px;text-align:center;border-top:14px solid #aa91f4}.symbol{width:88px;height:88px;margin:auto;display:grid;place-items:center;background:#f7c650;border-radius:30px;font-size:40px}h1{font-size:26px}p{color:#625b70;font-size:15px}a{display:block;min-height:48px;border-radius:28px;background:#201c29;color:white;padding:10px 20px;text-decoration:none}a:focus-visible{outline:3px solid #6942b5;outline-offset:4px}.small{font-size:12px;margin-bottom:0}</style></head><body><main><div class="symbol" aria-hidden="true">…</div><h1>یه مکث کوچیک!</h1><p>اینترنت قطع شده. برای ورود، پرداخت، ارسال پیام یا تغییر دریافت، به اتصال نیاز داری.</p><p>اگر وسط پرداخت بودی، بعد از اتصال وضعیت همون سفارش رو بررسی کن؛ دوباره خرید نکن.</p><a href="/">دوباره اتصال رو بررسی کنم</a><p class="small">هیچ درخواست تازه‌ای آفلاین ذخیره یا خودکار ارسال نمی‌شه.</p></main></body></html>
